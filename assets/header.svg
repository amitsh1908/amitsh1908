<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101F"/>
      <stop offset=".5" stop-color="#0D1B2F"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="130" y1="0" x2="1070" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset=".55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF9900"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#58A6FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle cx="70" cy="60" r="180" fill="url(#glow)" filter="url(#blur)">
      <animate attributeName="cx" values="70;320;70" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="300" r="200" fill="#7C3AED" opacity=".12" filter="url(#blur)">
      <animate attributeName="cy" values="300;120;300" dur="12s" repeatCount="indefinite"/>
    </circle>
    <g opacity=".13" stroke="#A5B4FC">
      <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200"/>
      <path d="M100 0V340M200 0V340M300 0V340M400 0V340M500 0V340M600 0V340M700 0V340M800 0V340M900 0V340M1000 0V340M1100 0V340"/>
    </g>
    <rect x="109" y="63" width="8" height="8" rx="4" fill="#3FB950">
      <animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="78" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">HELLO, WORLD — I'M</text>
    <text x="130" y="158" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="67" font-weight="750">AMIT SHARMA</text>
    <rect x="130" y="184" width="940" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="0;940;940" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="235" fill="#C9D1D9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">Software Engineer  ·  Full-Stack Developer  ·  Cloud Builder</text>
    <text x="130" y="284" fill="#FFB84D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">React  /  Spring Boot  /  Node.js  /  Java  /  AWS</text>
    <g transform="translate(1000 250)" fill="none" stroke="url(#accent)" stroke-width="4">
      <path d="M-42 0L0-42L42 0L0 42Z" opacity=".75">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </path>
      <circle r="18"/>
    </g>
  </g>
</svg>
